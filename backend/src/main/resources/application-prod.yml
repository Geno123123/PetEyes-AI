server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://capstone-db:3306/capstone?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 운영 환경에서는 보통 'validate' 또는 'none'을 권장합니다.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/naver"
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

app:
  ai:
    server-base-url: https://coke-landowner-skype.ngrok-free.dev
  auth:
    redirect-uri: ${AUTH_REDIRECT_URI}
    code-expiration-ms: 300000
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: 10800000
  naver:
    search:
      client-id: ${NAVER_SEARCH_CLIENT_ID}
      client-secret: ${NAVER_SEARCH_CLIENT_SECRET}
  s3:
    region: ap-northeast-2
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    bucket: ${AWS_S3_BUCKET}
    public-base-url: https://${AWS_S3_BUCKET}.s3.ap-northeast-2.amazonaws.com
    key-prefix: uploads
    max-file-size-bytes: 31457280
